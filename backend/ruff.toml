# Backend linter configuration.
# Formatters (black / prettier) are deliberately out of scope - see the ROADMAP
# change log for the rationale.

line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B", "PIE", "RUF"]

# In SQLAlchemy models the quotes in Mapped["Ship"] are REQUIRED: those classes are
# imported only under TYPE_CHECKING, so the name does not exist at runtime. UP037
# suggests removing them; applying that fix breaks mapper configuration.
ignore = ["UP037"]

[lint.flake8-bugbear]
# FastAPI calls Depends/Body/Query in argument defaults by design, so B008 is a
# false positive here.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query"]
